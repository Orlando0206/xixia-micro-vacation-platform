<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塞上论坛·西夏文旅交流社区</title>
    <style>
        :root {
            --primary-color: #D4AF37;
            --secondary-color: #CD853F;
            --accent-color: #A0522D;
            --text-color: #4B3621;
            --light-bg: #F5E6B3;
            --card-bg: rgba(255, 255, 255, 0.95);
            --border-color: rgba(212, 175, 55, 0.3);
            --shadow: 0 8px 25px rgba(0,0,0,0.1);
            --hover-shadow: 0 12px 35px rgba(0,0,0,0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', '方正古隶', 'Segoe UI', sans-serif;
            background: 
                linear-gradient(45deg, rgba(212, 175, 55, 0.05) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(212, 175, 55, 0.05) 25%, transparent 25%),
                linear-gradient(135deg, var(--light-bg) 0%, #E8D7A8 100%);
            background-size: 60px 60px, 60px 60px, 100% 100%;
            background-position: 0 0, 30px 30px, 0 0;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* 导航栏 */
        .navbar {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color), var(--accent-color));
            padding: 15px 0;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            color: white;
            text-decoration: none;
            font-size: 1.8em;
            font-weight: bold;
        }

        .logo-icon {
            font-size: 2em;
            margin-right: 10px;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-item a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .nav-item a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, #fff, #f0f0f0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .user-avatar:hover {
            transform: scale(1.1);
        }

        /* 主要内容区域 */
        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
        }

        /* 侧边栏 */
        .sidebar {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            height: fit-content;
            position: sticky;
            top: 120px;
        }

        .sidebar-title {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 20px;
            text-align: center;
            position: relative;
        }

        .sidebar-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 2px;
        }

        .scenic-categories {
            list-style: none;
        }

        .category-item {
            margin-bottom: 12px;
        }

        .category-link {
            display: flex;
            align-items: center;
            padding: 15px;
            background: linear-gradient(145deg, rgba(255,255,255,0.8), rgba(255,255,255,0.6));
            border: 2px solid transparent;
            border-radius: 15px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .category-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .category-link:hover::before {
            left: 100%;
        }

        .category-link:hover {
            border-color: var(--primary-color);
            transform: translateX(8px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
        }

        .category-link.active {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-color: var(--accent-color);
        }

        .category-icon {
            font-size: 1.3em;
            margin-right: 12px;
        }

        .category-info {
            flex: 1;
        }

        .category-name {
            font-size: 1em;
            margin-bottom: 2px;
        }

        .category-count {
            font-size: 0.8em;
            opacity: 0.8;
        }

        /* 主内容区域 */
        .content-area {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .content-title {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--text-color);
            display: flex;
            align-items: center;
        }

        .content-title-icon {
            font-size: 1.2em;
            margin-right: 12px;
            color: var(--primary-color);
        }

        .new-post-btn {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .new-post-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }

        /* 帖子列表 */
        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .post-item {
            background: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(255,255,255,0.7));
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .post-item:hover {
            border-color: var(--primary-color);
            box-shadow: var(--hover-shadow);
            transform: translateY(-2px);
        }

        .post-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .post-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 15px;
        }

        .post-info {
            flex: 1;
        }

        .post-author {
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 3px;
        }

        .post-time {
            font-size: 0.9em;
            color: #666;
        }

        .post-type {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            margin-left: auto;
        }

        .type-photo {
            background: linear-gradient(45deg, #FF6B6B, #FF8E8E);
            color: white;
        }

        .type-video {
            background: linear-gradient(45deg, #4ECDC4, #44A08D);
            color: white;
        }

        .type-text {
            background: linear-gradient(45deg, #45B7D1, #96C9F4);
            color: white;
        }

        .post-title {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .post-content {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .post-media {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .media-item {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .media-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .media-item:hover img {
            transform: scale(1.1);
        }

        .video-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
        }

        .post-stats {
            display: flex;
            align-items: center;
            gap: 20px;
            color: #666;
            font-size: 0.9em;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .stat-item:hover {
            color: var(--primary-color);
        }

        /* 发帖表单 */
        .new-post-form {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            display: none;
        }

        .new-post-form.active {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-color);
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .media-upload {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .upload-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: linear-gradient(45deg, var(--secondary-color), var(--accent-color));
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(205, 133, 63, 0.3);
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: var(--text-color);
            border: 2px solid var(--border-color);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-menu {
                display: none;
            }

            .main-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .sidebar {
                position: static;
                order: 2;
            }

            .content-header {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .media-upload {
                flex-direction: column;
                align-items: stretch;
            }
        }

        /* 动画效果 */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 返回按钮样式 - 与其他界面保持一致 */
        .back-btn {
            cursor: pointer;
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 24px;
            font-size: 18px;
            color: rgb(193, 163, 98);
            border: 2px solid rgb(193, 163, 98);
            border-radius: 34px;
            background-color: transparent;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
            overflow: hidden;
            z-index: 9999;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .back-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            margin: auto;
            width: 50px;
            height: 50px;
            border-radius: inherit;
            scale: 0;
            z-index: -1;
            background-color: rgb(193, 163, 98);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.320, 1);
        }

        .back-btn:hover::before {
            scale: 3;
        }

        .back-btn:hover {
            color: #212121;
            scale: 1.1;
            box-shadow: 0 0px 20px rgba(193, 163, 98,0.4);
        }

        .back-btn:active {
            scale: 1;
        }

        /* 内容过滤和视图切换 */
        .content-filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px;
            background: linear-gradient(145deg, rgba(255,255,255,0.8), rgba(255,255,255,0.6));
            border-radius: 15px;
            border: 2px solid var(--border-color);
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            background: white;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.9em;
        }

        .filter-btn.active {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-color: var(--primary-color);
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        /* 消息中心样式 */
        .message-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message-item {
            background: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(255,255,255,0.7));
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .message-item:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .message-item.unread {
            border-left: 4px solid var(--primary-color);
            background: linear-gradient(145deg, rgba(212, 175, 55, 0.1), rgba(212, 175, 55, 0.05));
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .message-type {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .type-system {
            background: linear-gradient(45deg, #3498db, #5dade2);
            color: white;
        }

        .type-like {
            background: linear-gradient(45deg, #e74c3c, #ec7063);
            color: white;
        }

        .type-comment {
            background: linear-gradient(45deg, #2ecc71, #58d68d);
            color: white;
        }

        .message-time {
            color: #666;
            font-size: 0.9em;
        }

        .message-title {
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        .message-content {
            color: #555;
            line-height: 1.5;
        }

        /* 空状态样式 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .empty-message {
            font-size: 0.9em;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- 返回主页按钮 -->
    <a href="入口.html" class="back-btn">← 返回首页</a>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">
                <span class="logo-icon"></span>
                塞上论坛
            </a>
            <ul class="nav-menu">
                <li class="nav-item"><a href="#" onclick="showAllPosts()">全部话题</a></li>
                <li class="nav-item"><a href="#" onclick="showHotPosts()">热门话题</a></li>
                <li class="nav-item"><a href="#" onclick="showMyPosts()">我的发布</a></li>
                <li class="nav-item"><a href="#" onclick="showNotifications()">消息中心</a></li>
            </ul>
            <div class="user-info">
                <div class="user-avatar" onclick="showUserProfile()">👤</div>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <div class="main-container">
        <!-- 侧边栏 - 景点分类 -->
        <div class="sidebar">
            <h3 class="sidebar-title">景点话题分区</h3>
            <ul class="scenic-categories">
                <li class="category-item">
                    <a href="#" class="category-link active" onclick="selectCategory('all')">
                        <span class="category-icon">🌟</span>
                        <div class="category-info">
                            <div class="category-name">全部分区</div>
                            <div class="category-count">2580条话题</div>
                        </div>
                    </a>
                </li>
                <li class="category-item">
                    <a href="#" class="category-link" onclick="selectCategory('zhongwei')">
                        <span class="category-icon">🏔️</span>
                        <div class="category-info">
                            <div class="category-name">中卫沙坡头</div>
                            <div class="category-count">456条话题</div>
                        </div>
                    </a>
                </li>
                <li class="category-item">
                    <a href="#" class="category-link" onclick="selectCategory('yinchuan')">
                        <span class="category-icon">🏛️</span>
                        <div class="category-info">
                            <div class="category-name">银川西夏王陵</div>
                            <div class="category-count">623条话题</div>
                        </div>
                    </a>
                </li>
                <li class="category-item">
                    <a href="#" class="category-link" onclick="selectCategory('shizuishan')">
                        <span class="category-icon">⛰️</span>
                        <div class="category-info">
                            <div class="category-name">石嘴山贺兰山</div>
                            <div class="category-count">389条话题</div>
                        </div>
                    </a>
                </li>
                <li class="category-item">
                    <a href="#" class="category-link" onclick="selectCategory('guyuan')">
                        <span class="category-icon">🌸</span>
                        <div class="category-info">
                            <div class="category-name">固原须弥山</div>
                            <div class="category-count">267条话题</div>
                        </div>
                    </a>
                </li>
                <li class="category-item">
                    <a href="#" class="category-link" onclick="selectCategory('wuzhong')">
                        <span class="category-icon">🎋</span>
                        <div class="category-info">
                            <div class="category-name">吴忠黄河湿地</div>
                            <div class="category-count">412条话题</div>
                        </div>
                    </a>
                </li>
                <li class="category-item">
                    <a href="#" class="category-link" onclick="selectCategory('culture')">
                        <span class="category-icon">📜</span>
                        <div class="category-info">
                            <div class="category-name">西夏文化</div>
                            <div class="category-count">433条话题</div>
                        </div>
                    </a>
                </li>
            </ul>
        </div>

        <!-- 主内容区域 -->
        <div class="content-area">
            <div class="content-header">
                <h2 class="content-title">
                    <span class="content-title-icon">🌟</span>
                    <span id="currentCategoryName">全部分区</span>
                </h2>
                <button class="new-post-btn" onclick="toggleNewPostForm()">
                    ✏️ 发布新话题
                </button>
            </div>

            <!-- 内容过滤器 -->
            <div class="content-filters" id="contentFilters" style="display: none;">
                <div class="filter-btn active" onclick="setFilter('all')">全部</div>
                <div class="filter-btn" onclick="setFilter('today')">今日热门</div>
                <div class="filter-btn" onclick="setFilter('week')">本周热门</div>
                <div class="filter-btn" onclick="setFilter('month')">本月热门</div>
            </div>

            <!-- 发帖表单 -->
            <div class="new-post-form" id="newPostForm">
                <form onsubmit="submitNewPost(event)">
                    <div class="form-group">
                        <label class="form-label" for="postTitle">话题标题</label>
                        <input type="text" id="postTitle" class="form-input" placeholder="输入您的话题标题..." required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="postContent">内容描述</label>
                        <textarea id="postContent" class="form-input form-textarea" placeholder="分享您的旅行体验、景点见闻、文化感悟..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">添加媒体</label>

        function cancelNewPost() {
            document.getElementById('newPostForm').classList.remove('active');
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('mediaPreview').innerHTML = '';
        }

        // 提交新帖子
        function submitNewPost(event) {
            event.preventDefault();
            
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
            const mediaPreview = document.getElementById('mediaPreview');
            const images = Array.from(mediaPreview.children).map(item => {
                const img = item.querySelector('img');
                return img ? img.src : null;
            }).filter(Boolean);
            
            const newPost = {
                id: Date.now(),
                title: title,
                content: content,
                author: currentUser.name,
                avatar: currentUser.avatar,
                category: currentCategory === 'all' ? 'culture' : currentCategory,
                type: images.length > 0 ? 'photo' : 'text',
                images: images.length > 0 ? images : null,
                time: '刚刚',
                likes: 0,
                comments: 0,
                shares: 0
            };
            
            posts.unshift(newPost);
            localStorage.setItem('forumPosts', JSON.stringify(posts));
            
            cancelNewPost();
            renderPosts();
            
            showToast('话题发布成功！', 'success');
        }

        // 上传照片
        function uploadPhoto() {
            document.getElementById('photoInput').click();
        }

        // 上传视频
        function uploadVideo() {
            document.getElementById('videoInput').click();
        }

        // 处理文件上传
        function handleFileUpload(event, type) {
            const files = Array.from(event.target.files);
            const preview = document.getElementById('mediaPreview');
            
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const mediaItem = document.createElement('div');
                    mediaItem.className = 'media-item';
                    mediaItem.style.position = 'relative';
                    mediaItem.innerHTML = `
                        <img src="${e.target.result}" alt="预览">
                        ${type === 'video' ? '<div class="video-overlay">▶</div>' : ''}
                        <button type="button" onclick="removeMedia(this)" style="position: absolute; top: 5px; right: 5px; background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer;">×</button>
                    `;
                    preview.appendChild(mediaItem);
                };
                reader.readAsDataURL(file);
            });
        }

        // 删除媒体预览
        function removeMedia(button) {
            button.parentElement.remove();
        }

        function likePost(postId) {
            const post = posts.find(p => p.id === postId);
            if (post) {
                post.likes++;
                localStorage.setItem('forumPosts', JSON.stringify(posts));
                renderPosts();
                showToast('点赞成功！', 'success');
            }

                    renderMyPosts();
                    break;
                case 'messages':
                    renderMessages();
                    break;

            // 根据时间过滤
            const now = new Date();
            if (currentFilter === 'today') {
                filteredPosts = posts.filter(post => {
                    return post.time.includes('小时前') || post.time === '刚刚';
                });
            } else if (currentFilter === 'week') {
                filteredPosts = posts.filter(post => {
                    return post.time.includes('小时前') || post.time.includes('天前') || post.time === '刚刚';
                });

            // 按点赞数排序
            filteredPosts.sort((a, b) => b.likes - a.likes);
            
            if (filteredPosts.length === 0) {
                postsList.innerHTML = `

            if (confirm('确定要删除这个帖子吗？此操作不可撤销。')) {
                const postIndex = posts.findIndex(p => p.id === postId);
                if (postIndex !== -1) {
                    posts.splice(postIndex, 1);
                    localStorage.setItem('forumPosts', JSON.stringify(posts));
                    renderMyPosts();
                    showToast('帖子已删除', 'success');
                }
            }
        }

        // 更新视图
        function updateView(view, title, titleIcon) {
            currentView = view;
            
            // 更新标题
            document.getElementById('currentCategoryName').textContent = title;
            document.querySelector('.content-title-icon').textContent = titleIcon;
            
            // 显示/隐藏过滤器
            const filters = document.getElementById('contentFilters');
            const newPostBtn = document.querySelector('.new-post-btn');
            
            if (view === 'hot') {
                filters.style.display = 'flex';
                newPostBtn.style.display = 'none';
            } else if (view === 'myPosts' || view === 'messages') {
                filters.style.display = 'none';
                newPostBtn.style.display = view === 'myPosts' ? 'flex' : 'none';
            } else {
                filters.style.display = 'none';
                newPostBtn.style.display = 'flex';
            }
            
            // 隐藏发帖表单
            document.getElementById('newPostForm').classList.remove('active');
            
            // 重新渲染内容
            renderCurrentView();
        }

        // 导航功能
        function showAllPosts() {
            selectCategory('all');
            updateView('posts', '全部分区', '🌟');
        }

        function showHotPosts() {
            updateView('hot', '热门话题', '🔥');
        }

        function showMyPosts() {
            updateView('myPosts', '我的发布', '📝');
        }

        function showNotifications() {
            updateView('messages', '消息中心', '📬');
        }

        // 消息提示函数
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const colors = {
                success: '#4CAF50',
                error: '#f44336',
                info: '#2196F3',
                warning: '#FF9800'
            };
            
            toast.style.cssText = `
                position: fixed;
                top: 100px;
                right: 20px;
                background: ${colors[type]};
                color: white;
                padding: 15px 20px;
                border-radius: 10px;
                font-weight: 600;
                z-index: 10000;
                animation: slideIn 0.3s ease-out;
                max-width: 300px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            `;
            toast.textContent = message;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
